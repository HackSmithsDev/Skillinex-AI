events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # 1. Frontend Server (skillinex.hacksmiths.dev)
    server {
        listen 5174;
        server_name skillinex.hacksmiths.dev localhost 127.0.0.1;

        root /app/frontend/dist;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /healthz {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }

    # 2. Render Platform Health Check Listener
    server {
        listen 8080 default_server;
        server_name _;

        location /healthz {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://127.0.0.1:5174;
        }
    }
}