services:
  - type: web
    name: skillinex
    runtime: docker
    plan: starter
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8080"
      - key: DEBUG
        value: "False"
      - key: FRONTEND_URL
        value: "https://skillinex.hacksmiths.dev"
      - key: CLOUDFLARE_TUNNEL_TOKEN
        sync: false
      # Neon pooled connection string (postgresql://...?sslmode=require&channel_binding=require)
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      # Upstash Redis (rediss://...) — used by Celery broker/backend and OTP/session cache
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: "HackSmiths Official"
      - key: MAIL_SERVER
        value: "smtpout.secureserver.net"
      - key: MAIL_PORT
        value: "465"
      - key: MAIL_USE_TLS
        value: "False"
      - key: MAIL_USE_SSL
        value: "True"
      - key: ADMIN_EMAIL
        value: "admin@hacksmiths.dev"